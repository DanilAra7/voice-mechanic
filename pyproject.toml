[project]
name = "mechanic"
version = "0.1.0"
description = "Self-hosted English voice agent: car mechanic assistant"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.11",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "openai>=3.14.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "selectolax>=0.4.11",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tool descriptions are prose the model reads; wrapping them hurts readability.
"src/mechanic/agent/tools.py" = ["E501"]
"src/mechanic/agent/prompt.py" = ["E501"]
