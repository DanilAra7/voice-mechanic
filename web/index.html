<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dex — voice mechanic</title>
<style>
  :root {
    --ground:#10141a; --panel:#171d25; --line:#26303b; --ink:#e4e8eb; --muted:#93a0ac;
    --mil:#f2a93c; --ok:#46c093; --tool:#6fb4de;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
       font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  h1{font-size:17px;margin:0;letter-spacing:.02em;text-transform:uppercase}
  h1 b{color:var(--mil)}
  #status{font:12px var(--mono);color:var(--muted);margin-left:auto}
  #status.live{color:var(--ok)}
  main{display:grid;grid-template-columns:1fr 300px;gap:16px;padding:16px;max-width:1080px;margin:0 auto}
  @media (max-width:820px){main{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px}
  #log{height:min(56vh,460px);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px}
  .msg{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:baseline;font-size:14.5px}
  .who{font:11px var(--mono);text-transform:uppercase;color:var(--muted)}
  .msg.dex .who{color:var(--mil)} .msg.you .who{color:var(--ok)} .msg.tool .who{color:var(--tool)}
  .msg.tool .text{font:12.5px var(--mono);color:var(--tool);word-break:break-all}
  .msg.sys{opacity:.7;font-style:italic}
  .meta{font:11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
  .controls{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
  button{font:inherit;padding:8px 16px;border-radius:5px;border:1px solid var(--line);
         background:#1f2833;color:var(--ink);cursor:pointer}
  button:disabled{opacity:.4;cursor:not-allowed}
  #talk{flex:1;min-width:160px;font-weight:600;border-color:var(--mil);color:var(--mil)}
  #talk.held{background:var(--mil);color:#120c02}
  input{font:12px var(--mono);padding:7px 9px;background:#0d1117;color:var(--ink);
        border:1px solid var(--line);border-radius:5px;min-width:0}
  aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
           margin:0;padding:12px 14px;border-bottom:1px solid var(--line)}
  .figures{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;border-bottom:1px solid var(--line)}
  .figure{padding:12px 6px} .figure+.figure{border-left:1px solid var(--line)}
  .figure span{display:block;font:11px var(--mono);color:var(--muted);text-transform:uppercase}
  .figure b{font:600 22px var(--mono);font-variant-numeric:tabular-nums}
  #breakdown{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
  .stage{display:grid;grid-template-columns:82px 1fr 40px;gap:8px;align-items:center;font-size:12px}
  .stage-name{color:var(--muted)}
  .stage-bar{height:7px;background:#0d1117;border-radius:4px;overflow:hidden}
  .stage-bar i{display:block;height:100%;background:var(--mil)}
  .stage-ms{font:11px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
  .note{padding:0 14px 13px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1><b>Dex</b> — voice mechanic</h1>
  <input id="wsUrl" size="30" aria-label="server">
  <input id="device" value="demo" size="6" aria-label="device">
  <input id="vehicle" value="audi_a4_b8" size="14" aria-label="vehicle">
  <button id="connect">Connect</button>
  <span id="status">not connected</span>
</header>

<main>
  <section class="panel">
    <div id="log"></div>
    <div class="controls">
      <button id="talk" disabled>Hold to talk</button>
      <button id="reset">New conversation</button>
    </div>
  </section>

  <aside class="panel">
    <h2>Latency</h2>
    <div class="figures">
      <div class="figure"><span>p50</span><b id="p50">—</b></div>
      <div class="figure"><span>p95</span><b id="p95">—</b></div>
      <div class="figure"><span>turns</span><b id="turnCount">0</b></div>
    </div>
    <div id="breakdown"></div>
    <p class="note">Milliseconds from the moment you stop speaking to the first sound coming back.
      Each bar is a stage of the last answer, measured on the server.</p>
  </aside>
</main>

<script src="app.js"></script>
</body>
</html>
