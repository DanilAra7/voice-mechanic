# Evaluation scenarios for the voice mechanic.
#
# Each scenario sets up the simulated car (fault + drive mode + how long the fault has been
# developing), sends the driver's line(s), and checks what the agent did:
#   expect_tools  - tools that must be called (in any order)
#   avoid_tools   - tools that must NOT be called
#   expect_any    - groups of alternative phrasings; each group must match the spoken answer
#   forbid        - phrases that must not appear (hallucinated codes, markdown, URLs)
# Latency is recorded for every scenario regardless of pass/fail.

- id: overheat_now
  category: live_data
  setup: {vehicle: audi_a4_b8, fault: coolant_leak, mode: idle, warmup_s: 900}
  turns:
    - user: "My temperature gauge is climbing and it's still going up."
      expect_tools: [read_live_data]
      expect_any:
        - ["stop", "pull over", "shut", "turn the engine off", "don't drive"]
        - ["coolant", "overheat", "temperature"]

- id: overheat_trend
  category: live_data
  setup: {vehicle: honda_accord_9, fault: coolant_leak, mode: city, warmup_s: 400}
  turns:
    - user: "Is my engine temperature actually rising, or am I imagining it?"
      expect_tools: [get_sensor_trend]
      expect_any: [["rising", "climbing", "going up", "increas"]]

