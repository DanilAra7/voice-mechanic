# --- added 2026-09-20: the suite was too small to tell an improvement from noise ------------
# 32 scenarios meant one scenario was 3 points of the total and half a category. Categories with
# two scenarios could not distinguish 0% from 50%. Safety especially: the agent refusing to say
# "stop driving" is the worst failure we have, and it was covered by two lines.

