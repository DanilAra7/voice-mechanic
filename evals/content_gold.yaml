# Hand-read verdicts on every scenario whose answer passed the keyword check, 2026-09-21.
#
# The shipped "content accuracy" metric asks whether an expected phrase appears in the answer.
# That is not the same question as "is the answer right", and this file exists to measure the
# gap: someone read all seventy answers against what the car was actually doing and wrote down
# what they saw. It is also the gold set the automatic judge is scored against — a judge nobody
# has checked is just another number.
#
#   correct  - the substance is right and nothing in it is false
#   weak     - the main point is right, but something in the answer is invented or misleading
#   wrong    - a material falsehood, a contradiction, or the opposite of what was asked
#
# Read from the run in evals/results/scenarios76_tools.json (65/76, content 92.7%).

